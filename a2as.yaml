manifest:
  version: "0.1.2"
  schema: https://a2as.org/cert/schema
  subject:
    name: wandb/fails
    source: https://github.com/wandb/fails
    branch: main
    commit: "159eea34"
    scope: [fails/cli/header.py, fails/cli/context_collector.py, fails/utils.py, fails/prompts.py, fails/weave_query.py, fails/spinner.py,
      fails/cli/config_selector.py, fails/pipeline.py, fails/cli/column_context_selector.py, fails/cli/failure_selector.py,
      fails/cli/evaluation_selector.py]
  issued:
    by: A2AS.org
    at: '2026-01-26T16:11:14Z'
  signatures:
    digest: sha256:YGg_uENyVr5TlwWC1BV-gw3nEMGCe0S5OsmRtdZzCsE
    key: ed25519:g0Nj8efkyhCeFpaRX6re3OOqV8kyRLb5W5l8DRQIRcw
    sig: ed25519:ithfj2unEOLigv5abX58cQU_PZ26jmdgGswkMXJ3pNpHBrXS7W2RvGLzFh2-KGBjG0nlZbdLchZG6jnAicHoCw

agents:
  draft_categorization_llm:
    type: instance
    models: [LitellmModel]
    params:
      function: draft_categorization
      name: Row by Row
      output_type: FirstPassCategorization
      instructions: [FIRST_PASS_CATEGORIZATION_SYSTEM_PROMPT]
  final_classification_llm:
    type: instance
    models: [LitellmModel]
    params:
      function: final_classification
      name: Final Classification
      output_type: FinalClassification
      instructions: ['# Task - Final Classification of Evaluation Failures', You are a helpful assistant that classifies evaluation
          failures into predefined categories., Your task is to analyze a single evaluation failure and classify it into one
          of the provided task failure categories., '## Important Notes:', '- You must select exactly ONE category from the
          provided list', '- If the failure doesn''t clearly fit into any of the predefined categories, classify it as "other"',
        '- Base your classification on the actual failure data, not on assumptions', '- Consider the user context to better
          understand the nature of the failure']
  review_categorizations_llm:
    type: instance
    models: [LitellmModel]
    params:
      function: aggregate_categorizations
      name: Review Agent
      output_type: ClusteringCategories
      instructions: [clustering_system_prompt_str]

models:
  LitellmModel:
    type: function
    agents: [draft_categorization_llm, final_classification_llm, review_categorizations_llm]

