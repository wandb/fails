      path: [fails.pipeline]

files:
  ./:
    type: pattern
    actions: [read]
    params:
      patterns: ['*.yaml']
      caller: [_find_configs]
  ./config/failure_categorization_config.yaml:
    type: variable
    actions: [read]
    params:
      caller: [Path]
  config_dir:
    type: variable
    actions: [read]
    params:
      caller: [Path]
  config_file:
    type: variable
    actions: [read]
    params:
      caller: [open, yaml.safe_load]
      alias: [f]
  config_path:
    type: literal
    actions: [read, write]
    params:
      caller: [Path('./config/failure_categorization_config.yaml'), open, yaml.safe_load, config_path.parent.mkdir]
  filepath:
    type: variable
    actions: [write]
    params:
      caller: [open]
      alias: [f]
  reports_dir:
    type: literal
    actions: [read, write]
    params:
      caller: [Path(reports), reports_dir.mkdir]
